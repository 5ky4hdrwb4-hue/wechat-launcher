<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f7f8fa;
            color: #333;
        }
        a {
            display: inline-block;
            padding: 14px 24px;
            background: #07c160;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Abrindo WeChat...</h2>
    <p id="status">Preparando conversa...</p>
    <a id="abrir" href="#" style="display:none">
        Abrir conversa no WeChat
    </a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (id && /^[a-zA-Z0-9_-]+$/.test(id)) {
            const url =
                "shortcuts://run-shortcut?name=Abrir%20Wechat&input=text&text=" +
                encodeURIComponent(id);

            const botao = document.getElementById("abrir");
            botao.href = url;
            botao.style.display = "inline-block";

            document.getElementById("status").textContent =
                "Abrindo conversa com " + id + "...";

            window.location.href = url;
        } else {
            document.getElementById("status").textContent =
                "WeChat ID não informado ou inválido.";
        }
    </script>
</body>
</html>
