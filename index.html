<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f7f8fa;
            color: #333;
        }
        button {
            padding: 14px 24px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Abrindo WeChat...</h2>
    <p id="status">Preparando conversa...</p>
    <button id="abrir" style="display:none">
        💬 Abrir conversa
    </button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const status = document.getElementById("status");
        const botao = document.getElementById("abrir");

        async function abrirWechat() {
            try {
                await navigator.clipboard.writeText(id);

                status.textContent = "Abrindo conversa com " + id + "...";

                window.location.href =
                    "shortcuts://run-shortcut?name=Abrir%20Wechat";

            } catch (erro) {
                status.textContent =
                    "O Safari bloqueou a cópia automática. Clique no botão abaixo.";
                botao.style.display = "inline-block";
            }
        }

        if (id && /^[a-zA-Z0-9_-]+$/.test(id)) {
            botao.style.display = "inline-block";
            botao.addEventListener("click", abrirWechat);

            // Tenta executar automaticamente
            abrirWechat();
        } else {
            status.textContent = "WeChat ID não informado ou inválido.";
        }
    </script>
</body>
</html>
